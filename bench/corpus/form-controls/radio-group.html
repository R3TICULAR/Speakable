<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>radio-group</title></head>
<body>
<fieldset>
  <legend>Shipping speed</legend>
  <input type="radio" id="std" name="ship" checked />
  <label for="std">Standard</label>
  <input type="radio" id="exp" name="ship" />
  <label for="exp">Express</label>
</fieldset>
</body></html>
