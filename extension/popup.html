<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speakable</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="28" height="20" rx="4" fill="#0D9488"/>
          <polygon points="8,24 14,24 10,30" fill="#0D9488"/>
          <path d="M12 11 L12 17" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M16 9 L16 19" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M20 11 L20 17" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name" data-i18n="brandName">Speakable</span>
      </div>
      <a href="https://getspeakable.dev/tool" target="_blank" class="web-link" data-i18n="webToolLink">Web Tool ↗</a>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="control-row">
        <label for="reader-select" data-i18n="labelScreenReader">Screen Reader</label>
        <select id="reader-select">
          <option value="nvda" selected>NVDA</option>
          <option value="jaws">JAWS</option>
          <option value="voiceover">VoiceOver</option>
          <option value="all">All</option>
        </select>
      </div>
      <div class="control-row">
        <label for="format-select" data-i18n="labelFormat">Format</label>
        <select id="format-select">
          <option value="text" data-i18n="formatText">Text</option>
          <option value="audit" data-i18n="formatAudit">Audit Report</option>
          <option value="json" data-i18n="formatJson">JSON</option>
        </select>
      </div>
      <div class="control-row">
        <label for="selector-input" data-i18n="labelCssSelector">CSS Selector</label>
        <input id="selector-input" type="text" data-i18n-placeholder="cssSelectorPlaceholder" placeholder="e.g. main, button, .hero" />
      </div>
    </div>

    <button id="analyze-btn" class="analyze-btn">
      <span class="btn-icon">▶</span>
      <span data-i18n="analyzeButton">Analyze This Page</span>
    </button>

    <!-- Status -->
    <div id="status" class="status hidden"></div>

    <!-- Results -->
    <div id="results" class="results hidden">
      <div class="results-header">
        <span id="results-title" class="results-title" data-i18n="resultsTitle">Results</span>
        <button id="copy-btn" class="icon-btn" data-i18n-title="copyToClipboard" title="Copy to clipboard">📋</button>
      </div>

      <!-- Voice controls -->
      <div id="voice-controls" class="voice-controls hidden">
        <div class="voice-controls-row">
          <button id="play-btn" class="voice-btn" data-i18n-title="voicePlay" data-i18n-aria="voicePlay" title="Play" aria-label="Play">▶</button>
          <button id="stop-btn" class="voice-btn hidden" data-i18n-title="voiceStop" data-i18n-aria="voiceStop" title="Stop" aria-label="Stop">⏹</button>
          <span id="progress" class="voice-progress hidden" aria-live="polite"></span>
        </div>
        <div class="voice-controls-row">
          <label for="voice-select" class="voice-label" data-i18n="voiceLabel">Voice</label>
          <select id="voice-select" class="voice-select" data-i18n-aria="voiceLabel" aria-label="Voice">
            <option value="" data-i18n="voiceDefault">Default</option>
          </select>
        </div>
        <div class="voice-controls-row">
          <label for="rate-slider" class="voice-label" data-i18n="speedLabel">Speed</label>
          <input id="rate-slider" class="rate-slider" type="range" min="0.5" max="2.0" step="0.1" value="1.0" data-i18n-aria="speedLabel" aria-label="Speech rate" />
          <span id="rate-value" class="rate-value">1.0x</span>
        </div>
      </div>

      <pre id="output" class="output"></pre>
    </div>

    <!-- Page info -->
    <div id="page-info" class="page-info hidden">
      <span id="page-title"></span>
      <span id="page-url"></span>
    </div>
  </div>

  <script src="analyzer-bridge.js"></script>
  <script src="popup.js"></script>
</body>
</html>
