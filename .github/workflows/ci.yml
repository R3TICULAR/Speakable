name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify executable
        run: |
          test -f dist/cli.js || (echo "CLI executable not found" && exit 1)
          test -f dist/index.js || (echo "Library entry not found" && exit 1)
          echo "Build artifacts verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  lint:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  a11y-dogfood:
    name: Accessibility Dogfood
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Install site dependencies
        working-directory: site
        run: npm install --legacy-peer-deps

      - name: Build site (static export)
        working-directory: site
        run: npx next build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder

      # --- Run Speakable against live site pages ---
      - name: Start site server and audit pages
        run: |
          cd site
          npx next start -p 3099 &
          SERVER_PID=$!
          sleep 5

          echo "=== Running Speakable audit on rendered site pages ==="
          PAGES=(
            "http://localhost:3099/"
            "http://localhost:3099/pricing"
            "http://localhost:3099/contact"
            "http://localhost:3099/privacy"
            "http://localhost:3099/terms"
            "http://localhost:3099/security"
            "http://localhost:3099/docs"
          )

          FAILED=0
          for url in "${PAGES[@]}"; do
            echo ""
            echo "--- Auditing: $url ---"
            HTML=$(curl -s "$url")
            echo "$HTML" | node dist/cli.js - -f audit || FAILED=1
          done

          if [ $FAILED -ne 0 ]; then
            echo "⚠️  Some pages have accessibility issues"
          fi

          kill $SERVER_PID 2>/dev/null || true
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Screen reader simulation on site pages
        run: |
          cd site
          npx next start -p 3098 &
          SERVER_PID=$!
          sleep 5

          echo "=== Screen reader output for homepage (all readers) ==="
          curl -s http://localhost:3098/ | node dist/cli.js - -f text -s all --selector "nav, main"

          echo ""
          echo "=== Screen reader output for pricing (all readers) ==="
          curl -s http://localhost:3098/pricing | node dist/cli.js - -f text -s all --selector "main"

          kill $SERVER_PID 2>/dev/null || true
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Regression diff check (examples as baseline)
        run: |
          echo "=== Semantic diff: example files as regression baseline ==="
          for file in examples/*.html; do
            echo "Checking: $file"
            node dist/cli.js "$file" -f audit || true
          done

      - name: Verify JSON output validity
        run: |
          echo "=== Verifying JSON output for example files ==="
          for file in examples/*.html; do
            echo "Checking: $file"
            node dist/cli.js "$file" -f json | node -e "
              let data = '';
              process.stdin.on('data', c => data += c);
              process.stdin.on('end', () => {
                JSON.parse(data);
                console.log('  ✓ Valid JSON');
              });
            "
          done

      - name: Verify Narrator renderer works
        run: |
          echo "=== Narrator output for navigation.html ==="
          node dist/cli.js examples/navigation.html -f text -s narrator
          echo ""
          echo "=== All 4 readers for form.html ==="
          node dist/cli.js examples/form.html -f text -s all
